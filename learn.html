<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoBoard — Learn Go</title>
  <meta name="description" content="Learn to play Go in 6 short interactive lessons: liberties, capturing, ko, eyes, counting and ending the game.">
  <link rel="canonical" href="https://playgoboard.netlify.app/learn.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GoBoard">
  <meta property="og:title" content="GoBoard — Learn Go">
  <meta property="og:description" content="Learn to play Go in 6 short interactive lessons.">
  <meta property="og:url" content="https://playgoboard.github.io/learn.html">
  <meta property="og:image" content="https://playgoboard.github.io/preview.png?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#302e2b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="js/theme.js?v=67"></script>
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html"><img class="logo-mark" src="img/logo.svg" alt="" width="30" height="30">GoBoard</a>
    <a class="menu-button" href="index.html" title="Main menu" aria-label="Main menu">☰</a>
    <nav id="nav">
      <a class="nav-item" href="index.html?mode=friend">Play a friend</a>
      <a class="nav-item" href="index.html?mode=bot">Bots</a>
      <a class="nav-item" href="index.html?mode=online">Online</a>
      <a class="nav-item daily-link" href="daily.html">Daily</a>
      <a class="nav-item" href="puzzles.html">Puzzles</a>
      <a class="nav-item" href="leaderboard.html">Leaderboard</a>
      <a class="nav-item" href="achievements.html">Achievements</a>
    </nav>
    <button id="btn-sound" class="sound-toggle" type="button"></button>
  </header>

  <!-- The lessons (js/learn-page.js, js/lessons-data.js). -->
  <main class="list-page" id="lesson-list">
    <div class="panel-block">
      <h1>🎓 Learn Go</h1>
      <p class="message">Six short lessons take you from zero to playing a full game. Each one explains an idea with a small board, then you try it yourself.</p>
      <button id="btn-continue" class="btn btn-primary" hidden></button>
      <div class="lesson-cards" id="lesson-cards"></div>
      <p class="message small-note" id="lesson-progress"></p>
    </div>
  </main>

  <main class="game-layout lesson-layout" id="lesson-view" hidden>
    <section class="board-column lesson-board-column">
      <div class="player-card puzzle-title-card">
        <span class="player-name" id="lesson-title"></span>
        <span class="player-info" id="lesson-step"></span>
      </div>
      <div id="lesson-board" class="board"></div>
    </section>
    <aside class="side-panel">
      <div class="panel-block controls-block">
        <p id="lesson-text" class="lesson-text"></p>
        <div id="lesson-choices" class="lesson-choices"></div>
        <p id="lesson-feedback" class="message"></p>
        <div id="lesson-finish" class="lesson-finish" hidden>
          <a class="btn btn-primary" href="index.html?mode=bot">Play Pebble</a>
          <a class="btn" href="puzzles.html#1">Beginner puzzles</a>
        </div>
        <div class="button-row">
          <button id="btn-step-back" class="btn">‹ Back</button>
          <button id="btn-hint" class="btn btn-hint">Hint</button>
          <button id="btn-step-next" class="btn btn-primary">Next ›</button>
        </div>
        <p class="account-links"><button class="link-button" id="btn-lessons">All lessons</button></p>
      </div>
    </aside>
  </main>

  <script src="js/i18n-load.js?v=67"></script>
  <script src="js/i18n.js?v=67"></script>
  <script src="js/app-install.js?v=67"></script>
  <script src="js/version-check.js?v=67"></script>
  <script src="js/go-rules.js?v=67"></script>
  <script src="js/go-bot.js?v=67"></script>
  <script src="js/sounds.js?v=67"></script>
  <script src="js/vendor/supabase-js-2.115.0.js"></script>
  <script src="js/supabase-config.js?v=67"></script>
  <script src="js/board-view.js?v=67"></script>
  <script src="js/puzzle-solver.js?v=67"></script>
  <script src="js/lessons-data.js?v=67"></script>
  <script src="js/chat-filter.js?v=67"></script>
  <script src="js/accounts.js?v=67"></script>
  <script src="js/avatars.js?v=67"></script>
  <script src="js/friends.js?v=67"></script>
  <script src="js/achievements.js?v=67"></script>
  <script src="js/live-games.js?v=67"></script>
  <script src="js/daily-badge.js?v=67"></script>
  <script src="js/learn-page.js?v=67"></script>
</body>
</html>
